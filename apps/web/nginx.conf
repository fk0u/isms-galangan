server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  # Header keamanan (audit S-05). TLS & HSTS ditangani Caddy di depan.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), geolocation=()" always;

  location ~ ^/(api|files|health)(/|$) {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 120s;
    # SSE (F4-03) butuh tanpa buffering.
    proxy_buffering off;
  }

  # Catatan: add_header di dalam location MENGHAPUS semua add_header level
  # server (header keamanan di atas). Cache diatur lewat `expires` saja.
  location /assets/ {
    expires max;
    try_files $uri =404;
  }

  # mime.types bawaan nginx tidak mengenal .webmanifest (jadi octet-stream);
  # sebagian browser menolak install PWA tanpa tipe yang benar.
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires epoch;
    try_files $uri =404;
  }

  # SPA: semua route lain ke index.html.
  location / {
    expires epoch;
    try_files $uri /index.html;
  }
}
