name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run check

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    env:
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      SQLITE_PATH: ./data/ci.db
      UPLOADS_DIR: ./data/uploads
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: services/api/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run migrate
      - run: npm run seed
      - run: npm run check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & smoke test stack (F5-01)
        run: |
          cat > deploy/.env <<ENV
          ISMS_DOMAIN=localhost
          WEB_ORIGINS=https://localhost
          JWT_SECRET=$(openssl rand -hex 32)
          DB_DIALECT=sqlite
          ALLOW_SEED_LOGIN=false
          ENV
          docker compose --env-file deploy/.env up -d --build api web
          for i in $(seq 1 30); do
            docker compose --env-file deploy/.env exec -T web wget -qO- http://127.0.0.1/health && break
            sleep 2
          done
          docker compose --env-file deploy/.env exec -T web wget -qO- http://127.0.0.1/health | grep -q '"ok":true'
          docker compose --env-file deploy/.env exec -T web wget -qO- http://127.0.0.1/ | grep -qi '<div id="root"'
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file deploy/.env logs --no-color | tail -200
